<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guinho-Bot">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<link rel="stylesheet" href="./styles.css">
<title>Guinho-Bot</title>
</head>
<body>
<main class="terminal-shell">
<header class="terminal-header">
<div class="brand"><span class="prompt">root@guinho:~$</span> <strong>GUINHO-BOT</strong></div>
<div class="status" aria-label="Status"><span>●</span> <span id="status-text">LOCAL READY</span></div>
</header>
<section id="chat" class="chat" aria-live="polite" aria-label="Conversa"></section>
<section class="quick-actions" aria-label="Atalhos">
<button type="button" data-cmd="/ajuda">/ajuda</button>
<button type="button" data-cmd="/moeda">/moeda</button>
<button type="button" data-cmd="/noticias">/noticias</button>
<button type="button" data-cmd="/tempo">/tempo</button>
</section>
<form id="composer" class="composer" autocomplete="off">
<label class="sr-only" for="message">Mensagem</label>
<input id="message" name="message" maxlength="12000" inputmode="text" enterkeyhint="send" placeholder="Digite um comando ou pergunta..." required>
<button type="submit">ENTER</button>
</form>
<footer class="terminal-footer">PLN LOCAL • RECUPERAÇÃO SEMÂNTICA • PWA • SEM API_KEY DE IA</footer>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
