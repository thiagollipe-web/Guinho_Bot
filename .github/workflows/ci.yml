name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check app.js
      - run: node --check retrieval.js
      - run: node --check memory.js
      - run: node --check context.js
      - run: node --check probabilistic.js
      - run: node --check knowledge.js
      - run: npm test
