name: Node CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check project syntax
        run: npm run check
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
