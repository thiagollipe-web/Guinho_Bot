name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check app.js
      - run: node --check retrieval.js
      - run: node --check memory.js
      - run: node --check context.js
      - run: node --check probabilistic.js
      - run: node --check knowledge.js
      - run: node --check prompt-library.js
      - run: node --check calibration.js
      - run: node --check generator.js
      - run: node --check analyzer.js
      - run: node --check fixer.js
      - run: node --check improver.js
      - run: node --check validator.js
      - run: node --check engine.js
      - run: node --check engineering-memory.js
      - run: node --check engineering-learning.js
      - run: node --check guinho-programmer.js
      # valida o núcleo conversacional especializado em programação
      - run: node --check api/chat.js
      - run: git diff --check
      - run: node --test tests/guinho-programmer.test.mjs
      - run: npm test
      - run: npm run benchmark
