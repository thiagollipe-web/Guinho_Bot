name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check public/app.js
      - run: node --check public/retrieval.js
      - run: node --check public/memory.js
      - run: node --check public/knowledge.js
