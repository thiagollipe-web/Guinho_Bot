<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guinho • IA Local</title>
<style>
body{margin:0;background:#0b0d10;color:#e8eaed;font:15px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:18px}h1{font-size:22px}.muted{color:#8d949e}.row{display:flex;gap:8px;flex-wrap:wrap}select,input,button{background:#15191f;color:#fff;border:1px solid #303741;border-radius:8px;padding:10px}button{cursor:pointer}textarea{width:100%;min-height:130px;box-sizing:border-box;background:#101419;color:#fff;border:1px solid #303741;border-radius:8px;padding:12px;margin-top:10px}.answer{white-space:pre-wrap;background:#101419;border:1px solid #252b33;border-radius:8px;padding:12px;margin-top:12px;min-height:80px}.models{display:grid;gap:8px;margin-top:12px}.model{border:1px solid #303741;border-radius:8px;padding:10px;background:#11151a}.model b{display:block}.model small{color:#8d949e}.model button{margin-top:8px;margin-right:6px}
</style></head><body><main><h1>Guinho • IA Local</h1><p class="muted">llama.cpp nativo • sem servidor • GGUF permanece no armazenamento privado do APK.</p>
<div class="row"><select id="model"><option value="qwen-0.5b">Qwen 0.5B</option><option value="qwen-1.5b">Qwen 1.5B</option><option value="nemotron-4b">Nemotron 4B</option></select><input id="tokens" type="number" min="16" max="2048" value="512"><button id="pick">Adicionar GGUF</button><button id="models">Gerenciar modelos</button></div>
<div id="modelList" class="models"></div><textarea id="prompt" placeholder="Digite uma pergunta..."></textarea><button id="send">Gerar resposta</button><div id="answer" class="answer">Pronto.</div></main>
<script>
const out=document.querySelector('#answer'),model=document.querySelector('#model'),prompt=document.querySelector('#prompt'),tokens=document.querySelector('#tokens'),list=document.querySelector('#modelList');
function nativeReady(){return !!(window.GuinhoNativeAI&&typeof window.GuinhoNativeAI.generate==='function');}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function refreshModels(){if(!nativeReady())return list.textContent='Bridge Android não encontrado.';try{const items=JSON.parse(window.GuinhoNativeAI.listModels());list.innerHTML=items.map(x=>'<div class="model"><b>'+esc(x.name)+'</b><small>'+esc(x.id)+' • '+(x.installed?Math.round(x.size/1048576)+' MB instalado':'não instalado')+'</small><br><button data-add="'+esc(x.id)+'">Adicionar/Substituir</button>'+(x.installed?'<button data-del="'+esc(x.id)+'">Remover</button>':'')+'</div>').join('');list.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{model.value=b.dataset.add;openPicker();});list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeModel(b.dataset.del));}catch(error){list.textContent='Erro: '+error.message;}}
function openPicker(){if(!nativeReady())return out.textContent='Bridge Android não encontrado.';window.GuinhoNativeAI.openGgufPicker(model.value);out.textContent='Selecione um arquivo .gguf no Android.';}
function removeModel(id){if(!confirm('Remover o GGUF de '+id+'?'))return;try{const result=JSON.parse(window.GuinhoNativeAI.deleteModel(id));if(!result.ok)return out.textContent='Erro: '+result.error;out.textContent='Modelo removido: '+id;refreshModels();}catch(error){out.textContent='Erro: '+error.message;}}
document.querySelector('#pick').onclick=openPicker;
document.querySelector('#models').onclick=refreshModels;
window.onGgufImportProgress=p=>{out.textContent='Importando GGUF... '+p+'%';};
window.onGgufImported=(id,size)=>{out.textContent='GGUF importado: '+id+' ('+Math.round(size/1048576)+' MB).';refreshModels();};
window.onGgufImportError=message=>{out.textContent='Erro ao importar: '+message;};
document.querySelector('#send').onclick=()=>{if(!nativeReady())return out.textContent='Bridge Android não encontrado.';if(!prompt.value.trim())return;out.textContent='Carregando GGUF e gerando...';try{const result=JSON.parse(window.GuinhoNativeAI.generate(JSON.stringify({modelId:model.value,prompt:prompt.value,maxTokens:Number(tokens.value)})));out.textContent=result.error||result.content||'Resposta vazia.';}catch(error){out.textContent='Erro: '+error.message;}};
refreshModels();
</script></body></html>
