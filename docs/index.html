<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Guinho — assistente conversacional com NLP, memória e regras.">
  <title>Guinho</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">G</span>
        <div>
          <h1>Guinho</h1>
          <p>assistente pessoal</p>
        </div>
      </div>
      <button id="menuButton" class="icon-button" type="button" aria-label="Abrir menu" aria-expanded="false">⋯</button>
      <div id="menu" class="menu" hidden>
        <button id="memoryButton" type="button">Memória</button>
        <button id="clear" type="button">Limpar conversa</button>
      </div>
    </header>

    <section id="chat" class="chat" aria-live="polite" aria-label="Conversa"></section>

    <form id="composer" class="composer">
      <label class="sr-only" for="input">Mensagem</label>
      <textarea id="input" rows="1" placeholder="Digite uma mensagem..." autocomplete="off"></textarea>
      <button class="send" type="submit" aria-label="Enviar mensagem">↑</button>
    </form>

    <section id="memoryPanel" class="panel" hidden aria-label="Memória do Guinho">
      <div class="panel-head">
        <div>
          <h2>Memória</h2>
          <p>Informações aprendidas nesta sessão</p>
        </div>
        <button id="closeMemory" class="icon-button" type="button" aria-label="Fechar memória">×</button>
      </div>
      <div id="memoryList" class="memory-list"></div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
