<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111">
  <title>Guinho — NLP Local</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Guinho</h1>
        <p>ELIZA + ChatterBot + NLP</p>
      </div>
      <span id="status">online</span>
    </header>

    <section id="chat" class="chat" aria-live="polite"></section>

    <form id="composer">
      <input id="input" autocomplete="off" placeholder="Fale com o Guinho..." aria-label="Mensagem">
      <button>Enviar</button>
    </form>

    <footer>
      <button id="clear" class="secondary">Limpar memória</button>
      <small>Núcleo simbólico • sem IA generativa</small>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
